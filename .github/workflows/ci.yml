name: CI

on:
  push:
    branches:
    - master
    - ci-*
  pull_request:
    branches:
    - master
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --release

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check every script parses
      run: ./tests/check-shell-syntax.sh

    - name: Check Cargo.lock is not tracked on a branch
      run: ./tests/check-no-lockfile.sh

  integration:
    name: Integration (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
        - debian:bookworm-slim
        - debian:trixie-slim
        - ubuntu:22.04
        - ubuntu:24.04
    steps:
    - uses: actions/checkout@v7

    # Built the way the package builds it, in a bullseye container: a helper
    # compiled against the runner's glibc will not run on an older image, and
    # every test then fails for a reason that has nothing to do with the code.
    - name: Build the helper
      run: ./build-helper.sh x86_64

    - name: Load the ipset modules the fixture needs
      run: ./tests/load-modules.sh

    - name: Report whether set matches work here
      run: ./tests/check-netfilter.sh ${{ matrix.image }}

    - name: Run the integration tests
      env:
        CFW_TEST_IMAGE: ${{ matrix.image }}
      run: ./tests/integration.sh

    - name: Keep the artifacts of a failed run
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: integration-${{ strategy.job-index }}
        path: tests/out/
        retention-days: 7
